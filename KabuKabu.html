<style>
/* Layout: marketing site with a live map hero; the app is a full-height map with a side panel (bottom sheet on phones); admin is a sidebar console. */
:root{
  --bg:#FFFFFF; --surface:#F4F4F1; --surface2:#EAEAE5; --ink:#101010; --muted:#666660; --line:#E4E4DE;

  --shadow:0 8px 30px rgba(16,16,16,.12);

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F0E; --surface:#1A1A18; --surface2:#262623; --ink:#F3F3EE; --muted:#9C9C94; --line:#2E2E2A;
  --btn:#F3F3EE; --btn-ink:#101010; --brand:#FF8236; --brand-soft:#3A2312;
  --ok:#5BCB8C; --ok-soft:#173526; --warn:#E3B45A; --warn-soft:#3A2D12; --bad:#EE7D6A; --bad-soft:#3A1A14;
  --land:#1B1D1B; --block:#232623; --road:#3A3C38; --roadcase:#121312; --water:#1B3544; --park:#1F3022;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F0E; --surface:#1A1A18; --surface2:#262623; --ink:#F3F3EE; --muted:#9C9C94; --line:#2E2E2A;
  --btn:#F3F3EE; --btn-ink:#101010; --brand:#FF8236; --brand-soft:#3A2312;
  --ok:#5BCB8C; --ok-soft:#173526; --warn:#E3B45A; --warn-soft:#3A2D12; --bad:#EE7D6A; --bad-soft:#3A1A14;
  --land:#1B1D1B; --block:#232623; --road:#3A3C38; --roadcase:#121312; --water:#1B3544; --park:#1F3022;
  --shadow:0 8px 30px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 0}

/* nav */

.logo{display:flex;align-items:center;gap:9px;font:800 1.4rem var(--display);letter-spacing:-.03em;text-decoration:none;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}

/* landing */

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding-bottom:64px}

.band{background:var(--brand-soft);border-radius:28px;padding:clamp(22px,4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:center}

.bars{display:flex;gap:8px;align-items:flex-end;height:120px}

details{border-bottom:1px solid var(--line);padding:18px 0}

.cta{background:var(--btn);color:var(--btn-ink);border-radius:28px;padding:clamp(28px,5vw,56px);text-align:center;margin-block:24px 64px}
.cta .btn{background:var(--btn-ink);color:var(--btn);margin-top:20px}
footer{border-top:1px solid var(--line);padding-block:34px 44px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer .wrap{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap}

/* app shell */
.shell{position:relative;display:grid;grid-template-columns:minmax(340px,430px) minmax(0,1fr);height:min(860px,calc(100vh - 92px));min-height:560px;margin-block:14px;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--bg)}
.panel{overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--line);min-width:0}
.mapbox{position:relative;min-width:0;min-height:0;grid-column:2;grid-row:1}
.panel{grid-column:1;grid-row:1}

  .shell{display:block;height:calc(100vh - 100px);min-height:520px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));border-radius:0;border-inline:0}
  .mapbox{position:absolute;inset:0}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:58%;border-right:0;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);background:var(--bg);padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:5}
}
.map{position:absolute;inset:0;background:var(--land);touch-action:none}

.legend{position:absolute;left:12px;top:12px;background:var(--bg);border-radius:12px;box-shadow:var(--shadow);padding:8px 12px;font-size:.76rem;display:flex;gap:12px;flex-wrap:wrap;z-index:3;max-width:calc(100% - 80px)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('fr-FR')+' FCFA';
const fmtKm=n=>n.toFixed(1).replace('.',',')+' km';
const now=()=>new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const ini=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const last8=v=>String(v||'').replace(/\D/g,'').slice(-8);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);

const PL=[
 {id:'marche',name:'Grand Marché',lat:13.5116,lng:2.1118},
 {id:'plateau',name:'Plateau',lat:13.5240,lng:2.1060},
 {id:'aeroport',name:'Aéroport Diori Hamani',lat:13.4815,lng:2.1836},
 {id:'univ',name:'Université Abdou Moumouni',lat:13.5280,lng:2.1030},
 {id:'hopital',name:'Hôpital National',lat:13.5155,lng:2.1155},
 {id:'yantala',name:'Yantala',lat:13.5340,lng:2.0990},
 {id:'lazaret',name:'Lazaret',lat:13.4990,lng:2.1330},
 {id:'koira',name:'Koira Kano',lat:13.4950,lng:2.1180},
 {id:'pont',name:'Pont Kennedy',lat:13.5070,lng:2.1010}
];
const GPS={id:'gps',name:'Ma position (GPS)',lat:13.5085,lng:2.1140};
const place=id=>id==='gps'?GPS:PL.find(p=>p.id===id);
const SIZE={S:{label:'Petit (enveloppe, sac)',extra:0},M:{label:'Moyen (carton, courses)',extra:100},L:{label:'Grand (15 kg maximum)',extra:250}};
const STATUS={searching:['Recherche','warn'],enroute:['Motard en route','acc'],ontrip:['En course','acc'],done:['Terminée','ok'],cancelled:['Annulée','bad'],no_rider:['Aucun motard','bad']};

let S,cfg,MAP=null,AMB=[];
const rad=x=>x*Math.PI/180;
function km(a,b){const R=6371,dLa=rad(b.lat-a.lat),dLo=rad(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function priceFor(d,extra){return Math.max(cfg.min,Math.round((cfg.base+cfg.perKm*d)/50)*50)+(extra||0);}
function quote(p,q,service,size){
  const d=Math.max(0.5,Math.round(km(p,q)*1.3*10)/10);
  const price=priceFor(d,service==='delivery'?SIZE[size].extra:0);
  const comm=Math.round(price*cfg.commission/100);
  return {d,price,comm,net:price-comm,eta:Math.max(3,Math.round(d/20*60))};
}
const riderById=id=>S.riders.find(r=>r.id===id);
const curTrip=()=>S.trips.find(t=>t.id===S.curId);
const busy=r=>S.trips.some(t=>t.riderId===r.id&&(t.status==='enroute'||t.status==='ontrip'));

function init(){

/* ---------- matching ---------- */
function logT(t,text){t.log.push({time:now(),text});}
function startMatching(t){t.radiusIdx=0;t.tried=[];t.log=[];t.offer=null;logT(t,'Recherche dans un rayon de '+cfg.radii[0]+' km');matchNext(t);}
function eligible(r,t,radius){return r.approved&&!r.blocked&&r.available&&r.balance>=cfg.minBalance&&!busy(r)&&!t.tried.includes(r.id)&&km(r,t.pickup)<=radius;}
function matchNext(t){
  if(t.status!=='searching')return;
  const radius=cfg.radii[t.radiusIdx];
  const c=S.riders.filter(r=>eligible(r,t,radius)).sort((a,b)=>km(a,t.pickup)-km(b,t.pickup));
  if(!c.length){
    if(t.radiusIdx<cfg.radii.length-1){t.radiusIdx++;logT(t,'Aucun motard libre. Rayon élargi à '+cfg.radii[t.radiusIdx]+' km');return matchNext(t);}
    t.status='no_rider';t.offer=null;logT(t,'Aucun motard disponible dans la zone');return render();
  }
  const r=c[0];t.tried.push(r.id);t.offer={riderId:r.id,until:Date.now()+20000};
  logT(t,'Demande envoyée à '+r.name+' ('+fmtKm(km(r,t.pickup))+')');
  clearTimeout(t.timer);
  if(S.rider.id===r.id){t.timer=setTimeout(()=>declineOffer(t,r,'n’a pas répondu'),20000);}
  else{t.timer=setTimeout(()=>{Math.random()<0.7?acceptOffer(t,r):declineOffer(t,r,'a refusé');},1800+Math.random()*1800);}
  render();
}
function declineOffer(t,r,why){if(t.status!=='searching'||!t.offer||t.offer.riderId!==r.id)return;clearTimeout(t.timer);logT(t,r.name+' '+why);t.offer=null;matchNext(t);}
function acceptOffer(t,r){
  if(t.status!=='searching'||!t.offer||t.offer.riderId!==r.id)return;
  clearTimeout(t.timer);
  t.status='enroute';t.riderId=r.id;t.offer=null;t.atPickup=false;t.atDest=false;
  t.etaMin=Math.max(2,Math.round(km(r,t.pickup)*1.3/20*60));
  logT(t,r.name+' a accepté. Arrivée estimée dans '+t.etaMin+' min');
  moveRider(r,t.pickup,()=>{t.atPickup=true;logT(t,r.name+' est arrivé au point de départ');render();});
  render();
}
function moveRider(r,target,done){
  cancelAnimationFrame(r.anim);
  const from={lat:r.lat,lng:r.lng},ms=Math.min(7000,Math.max(2500,km(from,target)*1400)),t0=performance.now();
  (function step(now){
    const k=Math.min(1,(now-t0)/ms);
    r.lat=from.lat+(target.lat-from.lat)*k;r.lng=from.lng+(target.lng-from.lng)*k;
    drawMap();
    if(k<1)r.anim=requestAnimationFrame(step);else if(done)done();
  })(t0);
}
function completeTrip(t){
  const r=riderById(t.riderId);
  t.status='done';t.doneAt=now();r.balance-=t.comm;
  S.txns.push({id:r.id,t:now(),label:'Commission '+t.id,amount:-t.comm,after:r.balance});
  if(r.balance<cfg.minBalance){r.available=false;toast('Solde sous '+fmt(cfg.minBalance)+'. Rechargez pour recevoir de nouvelles demandes.','bad');}
  logT(t,'Course terminée. Paiement espèces '+fmt(t.price));
  render();
}

function mapK(){if(!MAP)return 1;const r=MAP.svg.getBoundingClientRect();return r.width?Math.max(MAP.vb.w/r.width,MAP.vb.h/r.height):1;}

function zoomMap(f){if(!MAP)return;const v=MAP.vb,nw=Math.max(260,Math.min(1900,v.w*f)),ff=nw/v.w;const cx=v.x+v.w/2,cy=v.y+v.h/2;v.w=nw;v.h*=ff;v.x=cx-v.w/2;v.y=cy-v.h/2;setVB(true);}

}
function countNear(p,radius){return S.riders.filter(r=>r.approved&&!r.blocked&&r.available&&r.balance>=cfg.minBalance&&!busy(r)&&km(r,p)<=radius).length;}

function renderHero(){
  const h=S.hero,qt=h.pickup===h.dest?null:quote(place(h.pickup),place(h.dest),h.service,'S');

   +routeInputs(h.pickup,h.dest,'hero.pickup','hero.dest')
   +(qt?'<div class="row between"><div><div class="price num">'+fmt(qt.price)+'</div><p class="small muted">'+fmtKm(qt.d)+' · environ '+qt.eta+' min</p></div><span class="chip '+(near?'ok':'bad')+'">'+near+' motard'+(near>1?'s':'')+' proche'+(near>1?'s':'')+'</span></div><button class="btn primary block" data-act="heroOrder">Commander</button>':'<p class="chip bad">Choisissez un départ et une destination différents.</p>');

function updateCalcs(){
  const d=$('#dist');if(d){const v=Number(d.value);$('#distv').textContent=fmtKm(v);$('#distp').textContent=fmt(priceFor(v));}
  const c=$('#cpd'),a=$('#avg');
  if(c&&a){const n=Number(c.value),p=Number(a.value),g=n*p,cm=Math.round(g*cfg.commission/100);
    $('#cpdv').textContent=n;$('#avgv').textContent=fmt(p);$('#eg').textContent=fmt(g);$('#ec').textContent='− '+fmt(cm);$('#en').textContent=fmt(g-cm);}
}

function vTripCard(t){
  const r=t.riderId?riderById(t.riderId):null;
  let h='<div class="row between"><h2 style="font-size:1.5rem">'+(t.status==='searching'?'Recherche d’un motard':t.status==='enroute'?(t.atPickup?'Votre motard est arrivé':'Votre motard arrive'):t.status==='ontrip'?'En route':t.status==='done'?'Course terminée':t.status==='no_rider'?'Aucun motard':'Course annulée')+'</h2>'+chip(t.status)+'</div>';
  h+='<p class="muted small">'+esc(t.pickupName)+' → '+esc(t.destName)+' · '+t.id+'</p>';
  if(['searching','enroute','ontrip','done'].includes(t.status))h+=stepper(t);
  if(t.status==='searching'){
    const hint=t.offer&&t.offer.riderId===S.rider.id?'<p class="chip acc">Astuce démo : la demande attend le motard connecté. Ouvrez l’onglet Motard pour l’accepter.</p>':'';
    h+='<div class="row"><div class="spin"></div><p>Rayon de recherche : <b>'+cfg.radii[t.radiusIdx||0]+' km</b></p></div>'+hint+logHTML(t)+'<button class="btn danger block" data-act="cancel">Annuler</button>';
  }else if(t.status==='no_rider'){
    h+=logHTML(t)+'<div class="row"><button class="btn primary" data-act="retry">Réessayer</button><button class="btn" data-act="cancel">Annuler</button></div>';
  }else if(t.status==='enroute'||t.status==='ontrip'){
    h+='<div class="row" style="flex-wrap:nowrap"><div class="av">'+ini(r.name)+'</div><div style="min-width:0"><b>'+esc(r.name)+'</b><p class="small muted">★ '+r.rating.toFixed(1)+' · '+esc(r.moto)+'</p></div><div style="margin-left:auto"><span class="plate">'+esc(r.plate)+'</span></div></div>';
    if(t.status==='enroute'&&!t.atPickup)h+='<p>Arrivée dans environ <b>'+t.etaMin+' min</b>.</p>';
    if(t.pin)h+='<div><p class="small muted" style="margin-bottom:6px">Code de remise à donner au destinataire</p><span class="pin num">'+t.pin+'</span></div>';
    h+='<div class="kv"><span>À payer en espèces</span><b class="num">'+fmt(t.price)+'</b></div><p class="hint">Appels via l’application : votre numéro reste masqué.</p>';
    if(t.status==='enroute')h+='<button class="btn danger block" data-act="cancel">Annuler la course</button>';
    h+=logHTML(t);
  }else if(t.status==='done'){
    h+='<div class="kv"><span>Distance</span><b class="num">'+fmtKm(t.d)+'</b></div><div class="kv"><span>Payé en espèces</span><b class="num">'+fmt(t.price)+'</b></div><div><p class="small muted">Notez votre motard</p><div class="stars">'+[1,2,3,4,5].map(i=>'<button class="'+(i<=S.rating?'on':'')+'" data-act="rate" data-v="'+i+'" aria-label="'+i+' étoiles">★</button>').join('')+'</div></div><button class="btn primary block" data-act="newOrder">Nouvelle commande</button>';
  }else h+='<button class="btn primary block" data-act="newOrder">Nouvelle commande</button>';
  return h;
}

function vRider(){
  if(S.rider.mode==='new'&&!S.rider.id)return vRiderForm();

let tt;
function toast(m,k){const t=$('#toast');t.textContent=m;t.className='show'+(k==='bad'?' bad':'');clearTimeout(tt);tt=setTimeout(()=>{t.className='';},3400);}
function setPath(path,val){const p=path.split('.');let o=p[0]==='cfg'?cfg:S;for(let i=p[0]==='cfg'?1:0;i<p.length-1;i++){if(o[p[i]]==null)o[p[i]]={};o=o[p[i]];}o[p[p.length-1]]=val;}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.live==='calc'){updateCalcs();return;}
  if(!el.dataset.bind||el.type==='checkbox'||el.tagName==='SELECT')return;
  setPath(el.dataset.bind,el.type==='number'?Number(el.value):el.value);
  if(el.dataset.live==='settings'){const x=$('#ex');if(x)x.textContent=exampleHTML();}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.file){const f=el.files&&el.files[0];if(f){setPath(el.dataset.file,URL.createObjectURL(f));render();}return;}
  if(!el.dataset.bind)return;
  setPath(el.dataset.bind,el.type==='checkbox'?el.checked:el.type==='number'?Number(el.value):el.value);
  if(el.dataset.r!==undefined)render();
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset);});
function nav(route){if(location.hash==='#'+route)go(route);else location.hash='#'+route;}
function act(a,d){
  const r=S.rider.id?riderById(S.rider.id):null;
  switch(a){
    case 'go':nav(d.route);break;
    case 'scroll':{const el=document.getElementById(d.to);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});break;}
    case 'reset':{const rt=S.route;S.trips.forEach(t=>clearTimeout(t.timer));init();go(rt);toast('Démo réinitialisée');break;}
    case 'zoom':zoomMap(Number(d.f));break;
    case 'fitmap':if(MAP){MAP.fitKey='';mapSync();}break;
    case 'heroSvc':S.hero.service=d.v;render();break;
    case 'heroOrder':S.draft.service=S.hero.service;S.draft.pickup=S.hero.pickup;S.draft.dest=S.hero.dest;S.curId=null;nav('commander');break;
    case 'heroGo':S.draft.service=d.v;S.curId=null;nav('commander');break;
    case 'admTab':S.admTab=d.v;render();break;
    case 'svc':S.draft.service=d.v;render();break;
    case 'demoCust':S.cust={step:'ok',name:'Aïchatou Moussa',phone:'96 12 34 56'};render();break;
    case 'logoutCust':S.cust={step:'signup'};S.curId=null;render();break;
    case 'sendOtp':{const c=S.draftC;if(c.name.trim().length<2)return toast('Entrez votre nom complet.','bad');if(last8(c.phone).length!==8)return toast('Le numéro doit avoir 8 chiffres.','bad');S.cust={step:'otp'};render();break;}
    case 'verifyOtp':{if(S.draftC.otp.trim()!=='4821')return toast('Code incorrect.','bad');S.cust={step:'ok',name:S.draftC.name.trim(),phone:S.draftC.phone.trim()};toast('Compte créé');render();break;}
    case 'order':{
      const q=S.draft;
      if(q.service==='delivery'&&(!q.pkg.trim()||!q.rcvName.trim()||last8(q.rcvPhone).length!==8))return toast('Décrivez le colis et indiquez nom et téléphone du destinataire.','bad');
      const p=place(q.pickup),dd=place(q.dest),qt=quote(p,dd,q.service,q.size);
      const t={id:'C-'+String(S.seq++).padStart(4,'0'),service:q.service,pickup:{...p},dest:{...dd},pickupName:p.name,destName:dd.name,note:q.note,pkg:q.pkg,rcvName:q.rcvName,rcvPhone:q.rcvPhone,price:qt.price,comm:qt.comm,d:qt.d,pin:q.service==='delivery'?String(1000+Math.floor(Math.random()*9000)):null,status:'searching',riderId:null,time:now(),custName:S.cust.name,custPhone:S.cust.phone,log:[]};
      S.trips.unshift(t);S.curId=t.id;S.rating=0;startMatching(t);break;}
    case 'cancel':{const t=curTrip();if(t){clearTimeout(t.timer);t.status='cancelled';t.offer=null;}render();break;}
    case 'retry':{const t=curTrip();t.status='searching';startMatching(t);break;}
    case 'newOrder':S.curId=null;render();break;
    case 'rate':{S.rating=Number(d.v);const t=curTrip(),rr=t&&riderById(t.riderId);if(rr&&!t.rated){rr.rating=Math.round((rr.rating*rr.rn+S.rating)/(rr.rn+1)*10)/10;rr.rn++;t.rated=true;}render();break;}
    case 'riderNew':S.rider.mode='new';S.rider.step=0;render();break;
    case 'riderBack':S.rider.mode='pick';render();break;
    case 'riderLogin':S.rider.id=d.id;S.rider.pin='';render();break;
    case 'riderOut':S.rider.id=null;S.rider.mode='pick';render();break;
    case 'rprev':S.rider.step=Math.max(0,S.rider.step-1);render();break;
    case 'rnext':{
      const f=S.draftR,st=S.rider.step;
      if(st===0&&(!f.name.trim()||last8(f.phone).length!==8||!f.facePhoto))return toast('Indiquez votre nom, un téléphone à 8 chiffres et une photo de profil.','bad');
      if(st===1&&(!f.idNum.trim()||!f.idPhoto||!f.license.trim()||!f.licPhoto))return toast('Ajoutez les numéros et les photos de la carte d’identité et du permis.','bad');
      if(st===2&&(!f.plate.trim()||!f.moto.trim()||!f.motoPhoto))return toast('Indiquez la plaque, la marque et ajoutez la photo de la moto.','bad');
      S.rider.step=st+1;render();break;}
    case 'riderSubmit':{
      const f=S.draftR,ph=last8(f.phone),plate=f.plate.trim().toUpperCase(),idn=f.idNum.trim().toUpperCase(),lic=f.license.trim().toUpperCase();
      if(!f.terms)return toast('Acceptez les conditions pour continuer.','bad');
      const dup=S.riders.find(x=>last8(x.phone)===ph||x.idNum.toUpperCase()===idn||x.plate.toUpperCase()===plate||x.license.toUpperCase()===lic);
      if(dup){const why=last8(dup.phone)===ph?'ce numéro de téléphone':dup.idNum.toUpperCase()===idn?'cette carte d’identité':dup.plate.toUpperCase()===plate?'cette plaque':'ce permis';
        S.alerts.unshift({time:now(),kind:'bad',text:'Inscription refusée : '+why+' est déjà lié au compte de '+dup.name+'.'});
        return toast('Un compte existe déjà avec '+why+'.','bad');}
      const id='r'+(S.riders.length+1);
      S.riders.push({id,name:f.name.trim(),phone:f.phone.trim(),plate,idNum:idn,license:lic,moto:f.moto.trim(),guarantor:f.gName.trim()?f.gName.trim()+' ('+f.gPhone.trim()+')':'',balance:0,available:false,approved:false,status:'pending',blocked:false,lat:13.512+Math.random()*0.006,lng:2.108+Math.random()*0.012,rating:0,rn:0,photos:{id:f.idPhoto,lic:f.licPhoto,moto:f.motoPhoto,face:f.facePhoto}});
      S.rider.id=id;S.rider.step=0;S.draftR={name:'',phone:'',idNum:'',license:'',plate:'',moto:'',gName:'',gPhone:'',terms:false,idPhoto:null,licPhoto:null,motoPhoto:null,facePhoto:null};
      toast('Dossier envoyé');render();break;}
    case 'toggleAvail':r.available=!r.available;render();break;
    case 'amt':S.topup.amount=Number(d.v);render();break;
    case 'topup':{
      if(!(S.topup.amount>=cfg.minTopup))return toast('Recharge minimum : '+fmt(cfg.minTopup)+'.','bad');
      r.balance+=S.topup.amount;S.txns.push({id:r.id,t:now(),label:'Recharge '+(S.topup.method==='momo'?'mobile money':'agent'),amount:S.topup.amount,after:r.balance});
      toast('Solde rechargé : '+fmt(r.balance));render();break;}
    case 'accept':{const t=S.trips.find(x=>x.status==='searching'&&x.offer&&x.offer.riderId===r.id);if(t)acceptOffer(t,r);break;}
    case 'refuse':{const t=S.trips.find(x=>x.status==='searching'&&x.offer&&x.offer.riderId===r.id);if(t)declineOffer(t,r,'a refusé');break;}
    case 'pickedUp':{const t=S.trips.find(x=>x.riderId===r.id&&x.status==='enroute');t.status='ontrip';t.atDest=false;logT(t,'Départ vers '+t.destName);moveRider(r,t.dest,()=>{t.atDest=true;logT(t,r.name+' est arrivé à destination');render();});render();break;}
    case 'finish':{const t=S.trips.find(x=>x.riderId===r.id&&x.status==='ontrip');if(t.pin&&S.rider.pin.trim()!==t.pin)return toast('Code de remise incorrect.','bad');S.rider.pin='';completeTrip(t);break;}
    case 'approve':{const x=riderById(d.id);x.approved=true;x.status='approved';toast(x.name+' est validé. Il peut recharger son solde.');render();break;}
    case 'reject':{const x=riderById(d.id);x.status='rejected';render();break;}
    case 'block':{const x=riderById(d.id);x.blocked=!x.blocked;if(x.blocked)x.available=false;render();break;}
  }
}
function fromHash(){const h=location.hash.replace('#','');return ['accueil','commander','motard','admin'].includes(h)?h:'accueil';}
window.addEventListener('hashchange',()=>go(fromHash()));
setInterval(()=>{document.querySelectorAll('[data-until]').forEach(el=>{el.textContent=Math.max(0,Math.ceil((Number(el.dataset.until)-Date.now())/1000))+' s';});
  if(S&&S.route==='accueil'&&!document.hidden)drawMap();},100);
window.addEventListener('resize',()=>{if(MAP&&S.route!=='accueil'){MAP.fitKey='';mapSync();}});
init();go(fromHash());
</script>
